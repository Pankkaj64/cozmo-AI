[project]
name = "library-claim-backend"
version = "0.3.0"
description = "Library Contents Claim Agent: live sweep intake, identification, measurement, sourced pricing and claim packet."
requires-python = ">=3.11,<3.14"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]
